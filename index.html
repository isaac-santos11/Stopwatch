<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-image: linear-gradient(to left top, #00fc60, #45fcec);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 5rem;
        }

        #base {
            background-color: #ffffff;
            border-radius: 15px;
            border: 2px solid #000000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        button {
            background-color: #000000;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            margin: 0 10px;
            padding: 5px;
        }

        #play,
        #pause {
            width: 15px;
            height: 15px;
        }
    </style>
    <title>CRONOMETO</title>
</head>

<body>
    <div id="base">
        <h1>00:00</h1>
        <div id="buttons">
            <button id="btn-play" onclick="startTimer()"><img src="PLAY.png" alt="play" id="play"></button>
            <button id="btn-reset" onclick="resetTimer()"><img src="RESET.png" alt="reset" id="reset"></button>
            <button id="btn-pause" onclick="pauseTimer()"><img src="PAUSE.png" alt="pause" id="pause"></button>
        </div>
    </div>
</body>
<script>
    // Agrupamento de variáveis de estado
    let timer = null;
    let seconds = 0;

    const timerDisplay = document.querySelector('h1');

    function formatTime(totalSeconds) {
        const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
        const secs = (totalSeconds % 60).toString().padStart(2, '0');
        return `${mins}:${secs}`;
    }

    function updateDisplay() {
        if (timerDisplay) {
            timerDisplay.textContent = formatTime(seconds);
        }
    }

    function startTimer() {
        if (timer) return; 

        timer = setInterval(() => {
            seconds++;
            updateDisplay();
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timer);
        timer = null;
    }

    function resetTimer() {
        pauseTimer();
        seconds = 0;
        updateDisplay();
    }

</script>

</html>
